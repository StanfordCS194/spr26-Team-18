[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "startup-risk"
version = "0.1.0"
description = "Headless static risk scanner for public startup repositories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gitpython>=3.1,<4.0",
  "pydantic>=2.7,<3.0",
  "rich>=13.7,<14.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
startup-risk = "startup_risk.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["startup_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

